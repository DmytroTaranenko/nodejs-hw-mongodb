tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Creates a new contact.
security:
   - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Alex Smith'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '123456789'
          email:
            description: "Contact's email"
            type: string
            example: 'a.smith@example.com'
          isFavourite:
            description: 'Is favourite contact?'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'personal', 'home']
            default: 'personal'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: 'Created a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact'
              data:
                $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
