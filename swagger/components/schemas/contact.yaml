type: object 
required:
  -  _id
  -  userId
  -  name
  -  phoneNumber
  -  contactType
properties: 
  _id:
    description: "Contacts id"
    type: string
    format: objectID 
  name:
    description: "Contact's name"
    type: string
    example: "Max Smith"
  phoneNumber:
    description: "Contact's phoneNumber"
    type: string
    example: "+380123456789"
  email:
    description:   "Contact's email"
    type: string
    example: "emailTest@gmail.com"
  isFavourite:
    description: "Is the contact a favorite?"
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
    default: 'personal'
  userId:
    description: "This is User ID"
    type: string
    format: objectID
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/dexh9crag/image/upload/v1731532581/b4hozbi2hu2r3pmy3eda.png